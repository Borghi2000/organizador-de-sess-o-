name: Testar e gerar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Um push novo cancela o build anterior da mesma branch, em vez de deixar dois disputando runner.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regras:
    name: Testar as regras de estoque
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      # O core nao depende do Android, entao roda sozinho e rapido. Se uma regra de validade,
      # PVPS ou divergencia quebrar, o APK nem chega a ser compilado.
      - name: Rodar os testes do core
        working-directory: core
        run: ../gradlew test --no-daemon --console=plain

      - name: Guardar o relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dos-testes
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Gerar o APK assinado
    needs: regras
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Passo separado e barato: se o build travar aqui, o problema e a configuracao do projeto
      # (inclusive a ligacao com o core), e nao a compilacao em si.
      - name: Conferir a configuracao do projeto
        timeout-minutes: 10
        run: ./gradlew projects --no-daemon --console=plain --stacktrace

      - name: Compilar o APK de release
        timeout-minutes: 30
        run: ./gradlew assembleRelease --no-daemon --console=plain --stacktrace

      - name: Renomear o APK
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/release/app-release.apk \
             "entrega/estoque-chocolate-${GITHUB_RUN_NUMBER}.apk"

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: entrega/*.apk

      # Publica sempre no mesmo release, para o link de download nao mudar a cada versao.
      - name: Publicar o APK em Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-mais-recente >/dev/null 2>&1 || \
            gh release create apk-mais-recente \
              --title "APK mais recente" \
              --notes "APK gerado automaticamente a cada mudanca. Baixe o arquivo .apk abaixo e instale no celular." \
              --prerelease
          gh release upload apk-mais-recente entrega/*.apk --clobber
